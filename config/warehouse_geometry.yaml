# === 這個檔案是產生出來的，不要手改 ===
# 來源：drone_nodered/scripts/gen_warehouse.py，改幾何請改那支再重跑。
#
# 讀這個檔的人：
#   launch/warehouse_all.launch.py   spawn → PX4 生成點 ＋ odom_origin
#   scripts/start_empty_sitl.sh      spawn → PX4_GZ_MODEL_POSE
#
# 單位都是公尺，座標是 Gazebo 世界座標（ENU，x 東 y 北），
# 而這個場景的 map 座標系和它完全相同（maps/warehouse.yaml 的 origin
# 就是照這組幾何算的），所以同一組數字兩邊都能直接用。

# 飛機生成點（西南角起飛區）。到中間走道沒有直線可走 —— 這是
# 「Nav2 真的有用」的理由，不要改成空曠的地方。
spawn: [-14.000, -9.000]

# 可通行走道的中心 x。給「去第 N 條走道」這類指令用。
aisle_centers_x: [-5.600, 0.000, 5.600]
# 貨架中心 x（= 不可通行）。給自動產生測試點時排除用。
shelf_centers_x: [-8.400, -2.800, 2.800, 8.400]
# 走道在 y 方向的可用範圍（貨架只到 ±7.0）。
aisle_y_range: [-7.000, 7.000]

# 目標車巡迴的走道與範圍（move_target.py 的 aisle 模式，已不是預設）。
patrol_aisle_x: 0.000
patrol_y_range: [-6.000, 6.000]

# --- 環線（2026-10-08 新增）---------------------------------------
# 目標車繞第 2 排貨架（x=+2.8）轉圈，離貨架面 2.0 m。
# move_target.py --mode loop 會依序走這些點並回到第一點。
# ⚠️ 每一段都是直線，而且車和飛機都不會自己避障 ——
#    這些點經過 gen_warehouse.py 的自我檢查⑥（離障礙 >= 0.5 m）。
patrol_shelf_index: 2
target_loop: [[0.000, -9.000], [0.000, 9.000], [5.600, 9.000], [5.600, -9.000]]

# 飛機搜尋目標時巡航的環線。和車**同一條但方向相反** ——
# 反向相遇最快（47 m 環線，飛機 2 m/s 對車 0.5 m/s → 最久 19 秒）。
# 同向的話最久要 31 秒。
search_loop: [[5.600, -9.000], [5.600, 9.000], [0.000, 9.000], [0.000, -9.000]]
